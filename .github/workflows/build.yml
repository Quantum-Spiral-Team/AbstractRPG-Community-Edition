name: Java CI with Gradle for legacy-ce

on:
  push:
    branches: [ "legacy-ce" ]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA'
        required: false
        default: 'legacy-ce'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/buildscript.properties
            **/gradle-wrapper.properties
            **/gradle.lockfile

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --build-cache --info --stacktrace build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-jar
          path: build/libs/*.jar
          if-no-files-found: error

  server_test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: build
    env:
      MOD_STARTED_MARKER: ${{ github.workspace }}/run/server/.started

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/buildscript.properties
            **/gradle-wrapper.properties
            **/gradle.lockfile

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-jar
          path: build/libs

      - name: Verify artifact location
        run: ls -R build/libs || echo "No libs folder"

      - name: Run server
        env:
          MOD_STARTED_MARKER: ${{ github.workspace }}/run/server/.started
        run: |
          set -uo pipefail

          mkdir -p run/server
          echo "eula=true" | tee eula.txt run/eula.txt run/server/eula.txt >/dev/null
          printf "level-seed=-6202107849386030209\nonline-mode=true\n" > run/server/server.properties
          rm -f "$MOD_STARTED_MARKER"

          echo "stop" | timeout 240s ./gradlew runServer --no-daemon --stacktrace 2>&1 | tee server.log
          code=${PIPESTATUS[1]}   # echo=0, timeout/gradlew=1, tee=2
          if [ "$code" -ne 0 ]; then
            echo "::error::runServer exited with code $code (124 = timeout)"
            exit "$code"
          fi

      - name: Validate server run
        run: bash .github/scripts/validate-server.sh run server.log