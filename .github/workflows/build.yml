name: Java CI with Gradle for legacy-ce

on:
  push:
    branches: [ "legacy-ce" ]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA'
        required: false
        default: 'legacy-ce'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/buildscript.properties
            **/gradle-wrapper.properties
            **/gradle.lockfile

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --build-cache --info --stacktrace build --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-jar
          path: build/libs/*.jar
          if-no-files-found: error

  server_test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: build
    env:
      MOD_STARTED_MARKER: ${{ github.workspace }}/run/server/.started

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/buildscript.properties
            **/gradle-wrapper.properties
            **/gradle.lockfile

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-jar
          path: build/libs

      - name: Verify artifact location
        run: ls -R build/libs || echo "No libs folder"

      - name: Run server
        run: |
          set -uo pipefail

          mkdir -p run/server
          echo "eula=true" | tee eula.txt run/eula.txt run/server/eula.txt >/dev/null
          printf "level-seed=-6202107849386030209\nonline-mode=true\n" | tee run/server.properties run/server/server.properties >/dev/null
          rm -f "$MOD_STARTED_MARKER"

          mkfifo stdin.fifo
          exec 3<>stdin.fifo            
          timeout 200s ./gradlew runServer --no-daemon --stacktrace <stdin.fifo >server.log 2>&1 &
          pid=$!
          tail -f server.log &          
          tail_pid=$!

          for _ in $(seq 1 200); do
            [ -f "$MOD_STARTED_MARKER" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done

          sleep 15                      
          echo "stop" >&3

          wait "$pid"; code=$?
          kill "$tail_pid" 2>/dev/null || true

          if [ "$code" -eq 124 ]; then
            echo "::warning::Server did not stop within the timeout; relying on validation"
          elif [ "$code" -ne 0 ]; then
            echo "::error::runServer exited with code $code"
            exit "$code"
          fi

      - name: Validate server run
        run: bash .github/scripts/validate-server.sh run server.log